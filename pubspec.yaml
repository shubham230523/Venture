name: venture
description: "Venture - AI Business Simulation Game"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management & Architecture
  flutter_bloc: ^9.0.0
  equatable: ^2.0.7
  get_it: ^8.0.3

  # Networking & AI Abstraction
  dio: ^5.7.0

  # Data Persistence
  shared_preferences: ^2.3.5

  # UI, Fonts & Visuals
  google_fonts: ^6.2.1
  fl_chart: ^0.70.2
  intl: ^0.19.0
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  assets:
    - assets/audio/
    - assets/images/
